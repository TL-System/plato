name: PyTorch Full Qualification
permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  PyTorch-Tests:
    name: Python 3.13 / full qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    defaults:
      run:
        shell: zsh -lc ". {0}"
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv-mandatory

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Provision zsh
        shell: python {0}
        timeout-minutes: 3
        run: |
          import subprocess
          subprocess.run(["sudo", "apt-get", "update"], check=True)
          subprocess.run(["sudo", "apt-get", "install", "-y", "zsh"], check=True)

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"

      - name: Record provenance and check lock
        timeout-minutes: 2
        run: |
          set -eu
          mkdir -p ci-artifacts
          git rev-parse HEAD > ci-artifacts/commit.txt
          git submodule status --recursive > ci-artifacts/submodules.txt
          sha256sum uv.lock > ci-artifacts/lock.txt
          python --version > ci-artifacts/python.txt
          uv --version > ci-artifacts/uv.txt
          uv lock --check

      - name: Sync fresh base profile
        timeout-minutes: 10
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/plato-base
        run: |
          set -eu
          uv sync --locked --python 3.13 --no-default-groups --group test-base
          uv pip freeze --python "$UV_PROJECT_ENVIRONMENT/bin/python" > ci-artifacts/base-packages.txt

      - name: Base collection, suite and missing-extra probe
        timeout-minutes: 25
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/plato-base
          HF_HUB_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
        run: |
          set -eu
          uv run --no-sync --python 3.13 python -m pytest tests --collect-only --test-profile=base -m "not runtime" -ra > ci-artifacts/base-collection.log 2>&1
          uv run --no-sync --python 3.13 python -m pytest tests --test-profile=base -m "not runtime" -ra --basetemp=ci-artifacts/base-tmp --junitxml=ci-artifacts/base.xml > ci-artifacts/base.log 2>&1
          if uv run --no-sync --python 3.13 python -m pytest tests --collect-only --test-profile=mandatory > ci-artifacts/missing-extra.log 2>&1; then
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          log = Path("ci-artifacts/missing-extra.log").read_text()
          assert "mandatory prerequisite failed: No module named 'opacus'" in log, log
          PY

      - name: Sync fresh mandatory profile
        timeout-minutes: 10
        run: |
          set -eu
          uv sync --locked --python 3.13 --no-default-groups --group dev
          uv pip freeze --python "$UV_PROJECT_ENVIRONMENT/bin/python" > ci-artifacts/mandatory-packages.txt

      - name: Mandatory initialized core suite
        timeout-minutes: 30
        env:
          HF_HUB_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
        run: |
          set -eu
          uv run --no-sync --python 3.13 python -m pytest tests --test-profile=mandatory -m "not runtime" -ra --basetemp=ci-artifacts/mandatory-tmp --junitxml=ci-artifacts/mandatory.xml --cov=plato --cov-report=term --cov-report=json:ci-artifacts/coverage.json > ci-artifacts/mandatory.log 2>&1

      - name: Fresh startup, real CPU socket round and failure containment
        timeout-minutes: 16
        env:
          HF_HUB_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
        run: |
          set -eu
          uv run --no-sync --python 3.13 python -m pytest tests --test-profile=mandatory -m "runtime and not retained_model_search" -ra --basetemp=ci-artifacts/runtime-tmp --junitxml=ci-artifacts/runtime.xml > ci-artifacts/runtime.log 2>&1

      - name: Retained model-search qualification
        timeout-minutes: 25
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/plato-retained-model-search
          HF_HUB_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
        run: |
          set -eu
          uv sync --locked --python 3.13 --no-default-groups --group test-model-search
          uv pip freeze --python "$UV_PROJECT_ENVIRONMENT/bin/python" > ci-artifacts/model-search-packages.txt
          uv run --no-sync --python 3.13 python -c "import ptflops, opacus, kazoo, gymnasium" > ci-artifacts/model-search-prerequisites.log 2>&1
          uv run --no-sync --python 3.13 python -m pytest tests/integration/test_retained_model_search.py --collect-only -q --test-profile=mandatory -m retained_model_search > ci-artifacts/model-search-collection.log 2>&1
          uv run --no-sync --python 3.13 python -m pytest tests/integration/test_retained_model_search.py --test-profile=mandatory -m retained_model_search -ra --basetemp=ci-artifacts/model-search-tmp --junitxml=ci-artifacts/model-search.xml > ci-artifacts/model-search.log 2>&1
          python - <<'PY'
          import json
          import re
          from collections import Counter
          from pathlib import Path
          from xml.etree import ElementTree

          expected_case_names = [
              "test_retained_width_round[anycostfl]",
              "test_retained_width_round[fedrolex]",
              "test_retained_width_round[heterofl]",
              "test_retained_activated_budget[anycostfl]",
              "test_retained_activated_budget[fedrolex]",
              "test_retained_activated_budget[heterofl]",
              "test_sysheterofl_subnet_round",
              "test_dlg_model_update[lenet]",
              "test_dlg_model_update[resnet_18]",
              "test_local_retired_selection[anycostfl]",
              "test_local_retired_selection[fedrolex]",
              "test_local_retired_selection[heterofl]",
              "test_local_retired_selection[dlg]",
              "test_retained_entrypoint_import[anycostfl-root]",
              "test_retained_entrypoint_import[anycostfl-example]",
              "test_retained_entrypoint_import[fedrolex-root]",
              "test_retained_entrypoint_import[fedrolex-example]",
              "test_retained_entrypoint_import[heterofl-root]",
              "test_retained_entrypoint_import[heterofl-example]",
          ]


          def verify_model_search(
              collection: Path, junit: Path, runlog: Path, receipt: Path
          ) -> int:
              module = "tests/integration/test_retained_model_search.py"
              expected = Counter(f"{module}::{name}" for name in expected_case_names)
              issues = []
              collected = []
              names = []
              totals = {}
              outcomes = Counter()
              try:
                  collected = re.findall(r"^(\S+\.py::\S+)$", collection.read_text(), re.M)
                  if Counter(collected) != expected:
                      issues.append("Collection must contain every expected node exactly once.")
                  root = ElementTree.parse(junit).getroot()
                  cases = list(root.iter("testcase"))
                  names = [case.get("name", "") for case in cases]
                  if Counter(names) != Counter(expected_case_names):
                      issues.append("JUnit must contain every expected case exactly once.")
                  if any(
                      case.get("classname") != "tests.integration.test_retained_model_search"
                      for case in cases
                  ):
                      issues.append("JUnit cases must belong to the dedicated module.")
                  if any(
                      case.find(tag) is not None
                      for case in cases
                      for tag in ("failure", "error", "skipped")
                  ):
                      issues.append(
                          "Every JUnit case must pass without failure, error, skip or xfail."
                      )
                  totals = {
                      key: sum(int(suite.attrib[key]) for suite in root.iter("testsuite"))
                      for key in ("tests", "failures", "errors", "skipped")
                  }
                  if totals != {"tests": 19, "failures": 0, "errors": 0, "skipped": 0}:
                      issues.append("JUnit suite totals must report exactly 19 passing cases.")
                  for count, outcome in re.findall(
                      r"\b(\d+) (passed|failed|skipped|xfailed|xpassed|errors?)\b",
                      runlog.read_text(),
                  ):
                      outcomes[outcome] += int(count)
                  if outcomes != Counter({"passed": 19}):
                      issues.append("Execution must report 19 passes and no other outcome.")
              except (OSError, ValueError, KeyError, ElementTree.ParseError) as error:
                  issues.append(f"Missing or invalid qualification artifact: {error}")
              record = {
                  "schema_version": 1,
                  "accepted": not issues,
                  "expected_case_names": expected_case_names,
                  "collected_nodes": collected,
                  "junit_case_names": names,
                  "suite_totals": totals,
                  "execution_outcomes": dict(outcomes),
                  "issues": issues,
              }
              receipt.write_text(json.dumps(record, indent=2) + "\n")
              return int(bool(issues))


          raise SystemExit(
              verify_model_search(
                  Path("ci-artifacts/model-search-collection.log"),
                  Path("ci-artifacts/model-search.xml"),
                  Path("ci-artifacts/model-search.log"),
                  Path("ci-artifacts/model-search-acceptance.json"),
              )
          )
          PY

      - name: Lighteval CPU qualification
        timeout-minutes: 15
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/plato-llm-eval
          NLTK_DATA: ${{ runner.temp }}/plato-llm-eval-nltk
          HF_HOME: ${{ runner.temp }}/plato-llm-eval-hf
          CUDA_VISIBLE_DEVICES: ""
          ACCELERATE_USE_CPU: "true"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          set -eu
          uv sync --locked --python 3.13 --no-default-groups --group dev --extra llm_eval
          uv run --no-sync --python 3.13 python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path


          def interpreter_identity() -> dict:
              configured = os.environ["UV_PROJECT_ENVIRONMENT"]
              expected = Path(configured).resolve()
              executable = Path(os.path.abspath(sys.executable))
              assert Path(sys.prefix).resolve() == expected, (sys.prefix, configured)
              assert Path(sys.exec_prefix).resolve() == expected, (sys.exec_prefix, configured)
              assert sys.version_info[:2] == (3, 13), sys.version
              assert sys.prefix != sys.base_prefix, "A separate venv is required."
              # Preserve lexical executable ownership: venv binaries can be symlinks.
              assert executable.parent.resolve() == expected / "bin", executable
              return {
                  "configured_environment": configured, "executable": str(executable),
                  "prefix": sys.prefix, "exec_prefix": sys.exec_prefix,
                  "base_prefix": sys.base_prefix, "python": sys.version,
              }


          def checked_identity() -> dict:
              observed = interpreter_identity()
              receipt = json.loads(Path("ci-artifacts/llm-eval-interpreter.json").read_text())
              assert receipt == observed, (receipt, observed)
              return observed

          Path("ci-artifacts/llm-eval-interpreter.json").write_text(json.dumps(interpreter_identity(), indent=2) + "\n")
          PY
          uv pip freeze --python "$UV_PROJECT_ENVIRONMENT/bin/python" > ci-artifacts/llm-eval-packages.txt
          uv run --no-sync --python 3.13 python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path


          def interpreter_identity() -> dict:
              configured = os.environ["UV_PROJECT_ENVIRONMENT"]
              expected = Path(configured).resolve()
              executable = Path(os.path.abspath(sys.executable))
              assert Path(sys.prefix).resolve() == expected, (sys.prefix, configured)
              assert Path(sys.exec_prefix).resolve() == expected, (sys.exec_prefix, configured)
              assert sys.version_info[:2] == (3, 13), sys.version
              assert sys.prefix != sys.base_prefix, "A separate venv is required."
              # Preserve lexical executable ownership: venv binaries can be symlinks.
              assert executable.parent.resolve() == expected / "bin", executable
              return {
                  "configured_environment": configured, "executable": str(executable),
                  "prefix": sys.prefix, "exec_prefix": sys.exec_prefix,
                  "base_prefix": sys.base_prefix, "python": sys.version,
              }


          def checked_identity() -> dict:
              observed = interpreter_identity()
              receipt = json.loads(Path("ci-artifacts/llm-eval-interpreter.json").read_text())
              assert receipt == observed, (receipt, observed)
              return observed

          import hashlib
          import importlib.metadata
          import subprocess

          identity = checked_identity()
          resources = {}
          import nltk
          for name in ("punkt", "punkt_tab"):
              target = Path(os.environ["NLTK_DATA"]).resolve()
              target.mkdir(parents=True, exist_ok=True)
              cached = (target / "tokenizers" / name).is_dir()
              assert nltk.download(name, download_dir=str(target), raise_on_error=True)
              resolved = Path(str(nltk.data.find("tokenizers/" + name))).resolve()
              assert resolved.is_relative_to(target.resolve()), resolved
              resources[name] = {
                  "resolved": str(resolved), "cache_present_before": cached,
                  "origin": "NLTK downloader official package index",
                  "sha256": {str(p.relative_to(target)): hashlib.sha256(p.read_bytes()).hexdigest()
                             for p in sorted(resolved.rglob("*")) if p.is_file()},
              }
          # Load the exact production module only after explicit resource provisioning.
          import importlib.util
          spec = importlib.util.spec_from_file_location("plato_profile_preflight", "tests/conftest.py")
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module._eval_prerequisites()
          versions = {name: importlib.metadata.version(name) for name in
                      ("lighteval", "langdetect", "xxhash", "nltk", "transformers", "torch",
                       "datasets", "tokenizers", "opacus", "kazoo", "gymnasium")}
          record = {"interpreter": identity, "resources": resources,
                    "nltk_data_path": nltk.data.path, "packages": versions,
                    "preflight_passed": True,
                    "pipeline_origin": sys.modules["lighteval.pipeline"].__file__}
          Path("ci-artifacts/llm-eval-prerequisites.json").write_text(json.dumps(record, indent=2) + "\n")
          owned = ["uv.lock", "pyproject.toml", "tests/conftest.py",
                   "tests/llm_eval/cases.json", "tests/llm_eval/__init__.py",
                   "tests/llm_eval/helpers.py", "tests/llm_eval/test_lighteval_runtime.py",
                   "tests/test_llm_eval_profile_contract.py", "plato/evaluators/lighteval.py",
                   "plato/evaluators/lighteval_tasks.py", "tests/evaluators/test_lighteval.py",
                   "tests/evaluators/test_lighteval_materialization.py",
                   ".github/workflows/pytorch_tests.yml",
                   ".github/workflows/pytorch_qualification.yml",
                   ".github/scripts/stage_ci_artifacts.py"]
          source = {"interpreter": identity, "sha256": {
              name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in owned},
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "uv": subprocess.check_output(["uv", "--version"], text=True).strip()}
          Path("ci-artifacts/llm-eval-source-ledger.json").write_text(json.dumps(source, indent=2) + "\n")
          PY
          export HF_HUB_OFFLINE=1 HF_DATASETS_OFFLINE=1
          uv run --no-sync --python 3.13 python -m pytest tests/llm_eval --test-profile=llm-eval --collect-only -q > ci-artifacts/llm-eval-collection.log 2>&1
          uv run --no-sync --python 3.13 python - > ci-artifacts/llm-eval.log <<'PY'
          import json
          import os
          import sys
          from pathlib import Path


          def interpreter_identity() -> dict:
              configured = os.environ["UV_PROJECT_ENVIRONMENT"]
              expected = Path(configured).resolve()
              executable = Path(os.path.abspath(sys.executable))
              assert Path(sys.prefix).resolve() == expected, (sys.prefix, configured)
              assert Path(sys.exec_prefix).resolve() == expected, (sys.exec_prefix, configured)
              assert sys.version_info[:2] == (3, 13), sys.version
              assert sys.prefix != sys.base_prefix, "A separate venv is required."
              # Preserve lexical executable ownership: venv binaries can be symlinks.
              assert executable.parent.resolve() == expected / "bin", executable
              return {
                  "configured_environment": configured, "executable": str(executable),
                  "prefix": sys.prefix, "exec_prefix": sys.exec_prefix,
                  "base_prefix": sys.base_prefix, "python": sys.version,
              }


          def checked_identity() -> dict:
              observed = interpreter_identity()
              receipt = json.loads(Path("ci-artifacts/llm-eval-interpreter.json").read_text())
              assert receipt == observed, (receipt, observed)
              return observed

          print(json.dumps(checked_identity()))
          PY
          uv run --no-sync --python 3.13 python -m pytest tests/llm_eval --test-profile=llm-eval -ra -o junit_family=legacy --basetemp=ci-artifacts/llm-eval-tmp --junitxml=ci-artifacts/llm-eval.xml >> ci-artifacts/llm-eval.log 2>&1
          uv run --no-sync --python 3.13 python - > ci-artifacts/llm-eval-ty.log <<'PY'
          import json
          import os
          import sys
          from pathlib import Path


          def interpreter_identity() -> dict:
              configured = os.environ["UV_PROJECT_ENVIRONMENT"]
              expected = Path(configured).resolve()
              executable = Path(os.path.abspath(sys.executable))
              assert Path(sys.prefix).resolve() == expected, (sys.prefix, configured)
              assert Path(sys.exec_prefix).resolve() == expected, (sys.exec_prefix, configured)
              assert sys.version_info[:2] == (3, 13), sys.version
              assert sys.prefix != sys.base_prefix, "A separate venv is required."
              # Preserve lexical executable ownership: venv binaries can be symlinks.
              assert executable.parent.resolve() == expected / "bin", executable
              return {
                  "configured_environment": configured, "executable": str(executable),
                  "prefix": sys.prefix, "exec_prefix": sys.exec_prefix,
                  "base_prefix": sys.base_prefix, "python": sys.version,
              }


          def checked_identity() -> dict:
              observed = interpreter_identity()
              receipt = json.loads(Path("ci-artifacts/llm-eval-interpreter.json").read_text())
              assert receipt == observed, (receipt, observed)
              return observed

          print(json.dumps(checked_identity()))
          PY
          uv run --no-sync --python 3.13 ty check tests/conftest.py tests/test_llm_eval_profile_contract.py tests/llm_eval/__init__.py tests/llm_eval/helpers.py tests/llm_eval/test_lighteval_runtime.py plato/evaluators/lighteval.py plato/evaluators/lighteval_tasks.py tests/evaluators/test_lighteval.py tests/evaluators/test_lighteval_materialization.py --error-on-warning --output-format concise >> ci-artifacts/llm-eval-ty.log 2>&1
          uv run --no-sync --python 3.13 python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path


          def interpreter_identity() -> dict:
              configured = os.environ["UV_PROJECT_ENVIRONMENT"]
              expected = Path(configured).resolve()
              executable = Path(os.path.abspath(sys.executable))
              assert Path(sys.prefix).resolve() == expected, (sys.prefix, configured)
              assert Path(sys.exec_prefix).resolve() == expected, (sys.exec_prefix, configured)
              assert sys.version_info[:2] == (3, 13), sys.version
              assert sys.prefix != sys.base_prefix, "A separate venv is required."
              # Preserve lexical executable ownership: venv binaries can be symlinks.
              assert executable.parent.resolve() == expected / "bin", executable
              return {
                  "configured_environment": configured, "executable": str(executable),
                  "prefix": sys.prefix, "exec_prefix": sys.exec_prefix,
                  "base_prefix": sys.base_prefix, "python": sys.version,
              }


          def checked_identity() -> dict:
              observed = interpreter_identity()
              receipt = json.loads(Path("ci-artifacts/llm-eval-interpreter.json").read_text())
              assert receipt == observed, (receipt, observed)
              return observed

          import hashlib
          import re
          from collections import Counter
          from xml.etree import ElementTree


          def verify_llm_eval(root: Path) -> int:
              issues = []
              expected = Counter()
              collected = []
              junit_nodes = []
              outcomes = Counter()
              properties = []
              hashes = {}
              try:
                  identity = checked_identity()
                  ledger_path = Path("tests/llm_eval/cases.json")
                  ledger = json.loads(ledger_path.read_text())
                  assert ledger["schema_version"] == 1
                  expected = Counter(case["nodeid"] for case in ledger["cases"])
                  assert expected and all(count == 1 for count in expected.values())
                  assert all(node.startswith("tests/llm_eval/") and "::" in node
                             and ".." not in Path(node.split("::", 1)[0]).parts
                             for node in expected)
                  source = json.loads((root / "llm-eval-source-ledger.json").read_text())
                  assert source["interpreter"] == identity
                  for name, digest in source["sha256"].items():
                      actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
                      assert actual == digest, f"Source changed: {name}"
                      hashes[name] = actual
                  assert source["sha256"][str(ledger_path)] == hashlib.sha256(
                      ledger_path.read_bytes()).hexdigest()
                  prerequisites = json.loads((root / "llm-eval-prerequisites.json").read_text())
                  assert prerequisites["interpreter"] == identity
                  assert prerequisites["preflight_passed"] is True
                  assert set(prerequisites["resources"]) == {"punkt", "punkt_tab"}
                  for resource in prerequisites["resources"].values():
                      assert Path(resource["resolved"]).resolve().is_relative_to(
                          Path(os.environ["NLTK_DATA"]).resolve())
                  collected = re.findall(r"^(\S+\.py::\S+)$",
                                         (root / "llm-eval-collection.log").read_text(), re.M)
                  if Counter(collected) != expected:
                      issues.append("Collection must match the reviewed ledger exactly once.")
                  tree = ElementTree.parse(root / "llm-eval.xml").getroot()
                  cases = list(tree.iter("testcase"))
                  for case in cases:
                      classname = case.get("classname", "")
                      name = case.get("name", "")
                      junit_nodes.append(classname.replace(".", "/") + ".py::" + name)
                      for property_record in case.iter("property"):
                          properties.append({"nodeid": junit_nodes[-1],
                                             **property_record.attrib})
                      if any(case.find(tag) is not None for tag in ("failure", "error", "skipped")):
                          issues.append("JUnit has a nonpassing case.")
                  if Counter(junit_nodes) != expected:
                      issues.append("JUnit must match the reviewed ledger exactly once.")
                  totals = {key: sum(int(suite.attrib[key]) for suite in tree.iter("testsuite"))
                            for key in ("tests", "failures", "errors", "skipped")}
                  if totals != {"tests": sum(expected.values()), "failures": 0,
                                "errors": 0, "skipped": 0}:
                      issues.append("JUnit suite totals must match all passing ledger cases.")
                  runlog = (root / "llm-eval.log").read_text()
                  assert json.loads(runlog.splitlines()[0]) == identity
                  typing = (root / "llm-eval-ty.log").read_text().splitlines()
                  assert json.loads(typing[0]) == identity
                  assert "\n".join(typing[1:]).strip() == "All checks passed!"
                  for count, outcome in re.findall(
                      r"\b(\d+) (passed|failed|skipped|xfailed|xpassed|errors?)\b", runlog
                  ):
                      outcomes[outcome] += int(count)
                  if outcomes != Counter({"passed": sum(expected.values())}):
                      issues.append("Execution has missing passes or forbidden outcomes.")
                  if "Lighteval complete qualification" not in runlog:
                      issues.append("Production policy did not report complete qualification.")
              except (OSError, ValueError, KeyError, AssertionError, ElementTree.ParseError) as exc:
                  issues.append(f"Missing or invalid qualification artifact: {exc}")
              record = {"schema_version": 1, "accepted": not issues, "issues": issues,
                        "expected_nodes": list(expected), "collected_nodes": collected,
                        "junit_nodes": junit_nodes, "outcomes": dict(outcomes),
                        "sha256": hashes, "raw_runtime_properties": properties}
              (root / "llm-eval-acceptance.json").write_text(json.dumps(record, indent=2) + "\n")
              return int(bool(issues))


          raise SystemExit(verify_llm_eval(Path("ci-artifacts")))
          PY

      - name: Ruff and fatal configured typing
        timeout-minutes: 3
        run: |
          set -euo pipefail
          uv run --no-sync --python 3.13 ruff check . --select I | tee ci-artifacts/ruff.log
          uv run --no-sync --python 3.13 ty --version > ci-artifacts/ty-version.txt
          uv run --no-sync --python 3.13 ty check --output-format concise --error-on-warning | tee ci-artifacts/ty.log
          uv run --no-sync --python 3.13 ty check .github/scripts/stage_ci_artifacts.py --output-format concise --error-on-warning > ci-artifacts/ty-stager.log 2>&1

      - name: Stage qualification outputs without pytest aliases
        if: always()
        timeout-minutes: 2
        env:
          QUALIFICATION_STATUS: ${{ job.status }}
        run: |
          set -eu
          staging_flags=()
          if [[ "$QUALIFICATION_STATUS" == "success" ]]; then
            staging_flags+=(--require-complete)
          fi
          python .github/scripts/stage_ci_artifacts.py "${staging_flags[@]}"

      - name: Upload qualification outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytorch-3.13-${{ github.run_attempt }}
          path: ci-artifacts-upload/
          retention-days: 14
          if-no-files-found: warn
