name: PyTorch CI Tests
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  PyTorch-Tests:
    name: Python ${{ matrix.python }} / ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - python: "3.13"
            profile: supported-default
    defaults:
      run:
        shell: zsh -lc ". {0}"
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv-mandatory

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Provision zsh
        shell: python {0}
        timeout-minutes: 3
        run: |
          import subprocess
          subprocess.run(["sudo", "apt-get", "update"], check=True)
          subprocess.run(["sudo", "apt-get", "install", "-y", "zsh"], check=True)

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"

      - name: Record provenance and check lock
        timeout-minutes: 2
        run: |
          set -eu
          mkdir -p ci-artifacts
          git rev-parse HEAD > ci-artifacts/commit.txt
          git submodule status --recursive > ci-artifacts/submodules.txt
          sha256sum uv.lock > ci-artifacts/lock.txt
          python --version > ci-artifacts/python.txt
          uv --version > ci-artifacts/uv.txt
          uv lock --check

      - name: Sync fresh base profile
        timeout-minutes: 10
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/plato-base
        run: |
          set -eu
          uv sync --locked --python "${{ matrix.python }}" --no-default-groups --group test-base
          uv pip freeze --python "$UV_PROJECT_ENVIRONMENT/bin/python" > ci-artifacts/base-packages.txt

      - name: Base collection, suite and missing-extra probe
        timeout-minutes: 25
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/plato-base
          HF_HUB_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
        run: |
          set -eu
          uv run --no-sync --python "${{ matrix.python }}" python -m pytest tests --collect-only --test-profile=base -m "not runtime" -ra > ci-artifacts/base-collection.log 2>&1
          uv run --no-sync --python "${{ matrix.python }}" python -m pytest tests --test-profile=base -m "not runtime" -ra --basetemp=ci-artifacts/base-tmp --junitxml=ci-artifacts/base.xml > ci-artifacts/base.log 2>&1
          if uv run --no-sync --python "${{ matrix.python }}" python -m pytest tests --collect-only --test-profile=mandatory > ci-artifacts/missing-extra.log 2>&1; then
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          log = Path("ci-artifacts/missing-extra.log").read_text()
          assert "mandatory prerequisite failed: No module named 'opacus'" in log, log
          PY

      - name: Sync fresh mandatory profile
        timeout-minutes: 10
        run: |
          set -eu
          uv sync --locked --python "${{ matrix.python }}" --no-default-groups --group dev
          uv pip freeze --python "$UV_PROJECT_ENVIRONMENT/bin/python" > ci-artifacts/mandatory-packages.txt

      - name: Mandatory initialized core suite
        timeout-minutes: 30
        env:
          HF_HUB_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
        run: |
          set -eu
          uv run --no-sync --python "${{ matrix.python }}" python -m pytest tests --test-profile=mandatory -m "not runtime" -ra --basetemp=ci-artifacts/mandatory-tmp --junitxml=ci-artifacts/mandatory.xml --cov=plato --cov-report=term --cov-report=json:ci-artifacts/coverage.json > ci-artifacts/mandatory.log 2>&1

      - name: Fresh startup, real CPU socket round and failure containment
        timeout-minutes: 16
        env:
          HF_HUB_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
        run: |
          set -eu
          uv run --no-sync --python "${{ matrix.python }}" python -m pytest tests --test-profile=mandatory -m "runtime and not retained_model_search" -ra --basetemp=ci-artifacts/runtime-tmp --junitxml=ci-artifacts/runtime.xml > ci-artifacts/runtime.log 2>&1

      - name: Retained model-search qualification
        timeout-minutes: 25
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/plato-retained-model-search
          HF_HUB_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
        run: |
          set -eu
          uv sync --locked --python 3.13 --no-default-groups --group test-model-search
          uv pip freeze --python "$UV_PROJECT_ENVIRONMENT/bin/python" > ci-artifacts/model-search-packages.txt
          uv run --no-sync --python 3.13 python -c "import ptflops, opacus, kazoo, gymnasium" > ci-artifacts/model-search-prerequisites.log 2>&1
          uv run --no-sync --python 3.13 python -m pytest tests/integration/test_retained_model_search.py --collect-only -q --test-profile=mandatory -m retained_model_search > ci-artifacts/model-search-collection.log 2>&1
          uv run --no-sync --python 3.13 python -m pytest tests/integration/test_retained_model_search.py --test-profile=mandatory -m retained_model_search -ra --basetemp=ci-artifacts/model-search-tmp --junitxml=ci-artifacts/model-search.xml > ci-artifacts/model-search.log 2>&1
          python - <<'PY'
          import json
          import re
          from collections import Counter
          from pathlib import Path
          from xml.etree import ElementTree

          expected_case_names = [
              "test_retained_width_round[anycostfl]",
              "test_retained_width_round[fedrolex]",
              "test_retained_width_round[heterofl]",
              "test_retained_activated_budget[anycostfl]",
              "test_retained_activated_budget[fedrolex]",
              "test_retained_activated_budget[heterofl]",
              "test_sysheterofl_subnet_round",
              "test_dlg_model_update[lenet]",
              "test_dlg_model_update[resnet_18]",
              "test_local_retired_selection[anycostfl]",
              "test_local_retired_selection[fedrolex]",
              "test_local_retired_selection[heterofl]",
              "test_local_retired_selection[dlg]",
              "test_retained_entrypoint_import[anycostfl-root]",
              "test_retained_entrypoint_import[anycostfl-example]",
              "test_retained_entrypoint_import[fedrolex-root]",
              "test_retained_entrypoint_import[fedrolex-example]",
              "test_retained_entrypoint_import[heterofl-root]",
              "test_retained_entrypoint_import[heterofl-example]",
          ]


          def verify_model_search(
              collection: Path, junit: Path, runlog: Path, receipt: Path
          ) -> int:
              module = "tests/integration/test_retained_model_search.py"
              expected = Counter(f"{module}::{name}" for name in expected_case_names)
              issues = []
              collected = []
              names = []
              totals = {}
              outcomes = Counter()
              try:
                  collected = re.findall(r"^(\S+\.py::\S+)$", collection.read_text(), re.M)
                  if Counter(collected) != expected:
                      issues.append("Collection must contain every expected node exactly once.")
                  root = ElementTree.parse(junit).getroot()
                  cases = list(root.iter("testcase"))
                  names = [case.get("name", "") for case in cases]
                  if Counter(names) != Counter(expected_case_names):
                      issues.append("JUnit must contain every expected case exactly once.")
                  if any(
                      case.get("classname") != "tests.integration.test_retained_model_search"
                      for case in cases
                  ):
                      issues.append("JUnit cases must belong to the dedicated module.")
                  if any(
                      case.find(tag) is not None
                      for case in cases
                      for tag in ("failure", "error", "skipped")
                  ):
                      issues.append(
                          "Every JUnit case must pass without failure, error, skip or xfail."
                      )
                  totals = {
                      key: sum(int(suite.attrib[key]) for suite in root.iter("testsuite"))
                      for key in ("tests", "failures", "errors", "skipped")
                  }
                  if totals != {"tests": 19, "failures": 0, "errors": 0, "skipped": 0}:
                      issues.append("JUnit suite totals must report exactly 19 passing cases.")
                  for count, outcome in re.findall(
                      r"\b(\d+) (passed|failed|skipped|xfailed|xpassed|errors?)\b",
                      runlog.read_text(),
                  ):
                      outcomes[outcome] += int(count)
                  if outcomes != Counter({"passed": 19}):
                      issues.append("Execution must report 19 passes and no other outcome.")
              except (OSError, ValueError, KeyError, ElementTree.ParseError) as error:
                  issues.append(f"Missing or invalid qualification artifact: {error}")
              record = {
                  "schema_version": 1,
                  "accepted": not issues,
                  "expected_case_names": expected_case_names,
                  "collected_nodes": collected,
                  "junit_case_names": names,
                  "suite_totals": totals,
                  "execution_outcomes": dict(outcomes),
                  "issues": issues,
              }
              receipt.write_text(json.dumps(record, indent=2) + "\n")
              return int(bool(issues))


          raise SystemExit(
              verify_model_search(
                  Path("ci-artifacts/model-search-collection.log"),
                  Path("ci-artifacts/model-search.xml"),
                  Path("ci-artifacts/model-search.log"),
                  Path("ci-artifacts/model-search-acceptance.json"),
              )
          )
          PY

      - name: Ruff and classified typing baseline
        timeout-minutes: 3
        run: |
          set -eu
          uv run --no-sync --python "${{ matrix.python }}" ruff check . --select I > ci-artifacts/ruff.log 2>&1
          ty_status=0
          uv run --no-sync --python "${{ matrix.python }}" ty check --output-format concise > ci-artifacts/ty.log 2>&1 || ty_status=$?
          python - "$ty_status" <<'PY'
          import re
          import sys
          from pathlib import Path
          owned = {
              "tests/conftest.py", "tests/integration/utils.py",
              "tests/test_retired_backends.py", "plato/utils/retired_backends.py",
              "tests/trainers/test_dp_data_loader_strategy.py",
              "tests/clients/test_feddf_strategy.py",
              "tests/servers/test_feddf_server_strategy.py",
              "tests/datasources/test_huggingface_datasource.py",
              "tests/integration/test_event_loop_startup.py",
              # Static native coverage also runs where MLX is unavailable.
              "plato/algorithms/mlx_fedavg.py",
              "plato/algorithms/registry.py",
              "plato/models/registry.py",
              "plato/servers/fedavg.py",
              "plato/trainers/mlx.py",
              "plato/trainers/registry.py",
              "plato/utils/tree.py",
              "tests/mlx_import_audit_runner.py",
              "tests/mlx_native/__init__.py",
              "tests/mlx_native/benchmark.py",
              "tests/mlx_native/helpers.py",
              "tests/mlx_native/seed_probe.py",
              "tests/mlx_native/socket_harness.py",
              "tests/mlx_native/socket_probe.py",
              "tests/mlx_native/test_phase3_controls.py",
              "tests/mlx_native/test_phase3_dispatch.py",
              "tests/mlx_native/test_phase3_rng.py",
              "tests/mlx_native/test_phase3_runtime.py",
              "tests/mlx_native/test_phase3_selection.py",
              "tests/mlx_native/test_phase3_socket.py",
              "tests/mlx_native/test_phase3_tree_contract.py",
              "tests/test_mlx_import_contract.py",
              "tests/test_mlx_profile_contract.py",
              "tests/test_model_search_retirement.py",
              "tests/integration/test_retained_model_search.py",
              "tests/integration/model_search_retention_worker.py",
              "examples/gradient_leakage_attacks/dlg_model.py",
              "examples/model_search/anycostfl/anycostfl.py",
              "examples/model_search/fedrolex/fedrolex.py",
              "examples/model_search/heterofl/heterofl.py",
              ".github/scripts/stage_ci_artifacts.py",
              "tests/test_model_search_profile_contract.py",
          }
          allowed = {
              ("tests/datasources/test_huggingface_datasource.py", "99", "5", "invalid-assignment"),
              ("tests/datasources/test_huggingface_datasource.py", "100", "5", "invalid-assignment"),
          }
          log = Path("ci-artifacts/ty.log").read_text()
          status = int(sys.argv[1])
          assert status in (0, 1), f"ty exited with status {status}: {log}"
          matches = list(re.finditer(r"^(.+?):(\d+):(\d+): (?:error|warning)\[([^]]+)\]", log, re.M))
          if status == 0:
              assert log.strip() == "All checks passed!" and not matches, log
          else:
              report = re.search(r"^Found ([1-9][0-9]*) diagnostics?$", log, re.M)
              assert report is not None and len(matches) == int(report[1]), log
          for match in matches:
              assert match[1] not in owned or match.groups() in allowed, match[0]
          PY
          uv run --no-sync --python "${{ matrix.python }}" ty check .github/scripts/stage_ci_artifacts.py --output-format concise --error-on-warning > ci-artifacts/ty-stager.log 2>&1

      - name: Stage qualification outputs without pytest aliases
        if: always()
        timeout-minutes: 2
        env:
          QUALIFICATION_STATUS: ${{ job.status }}
        run: |
          set -eu
          staging_flags=()
          if [[ "$QUALIFICATION_STATUS" == "success" ]]; then
            staging_flags+=(--require-complete)
          fi
          python .github/scripts/stage_ci_artifacts.py "${staging_flags[@]}"

      - name: Upload qualification outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytorch-${{ matrix.python }}-${{ github.run_attempt }}
          path: ci-artifacts-upload/
          retention-days: 14
          if-no-files-found: warn
