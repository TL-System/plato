[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "plato-learn"
version = "1.4.3"
description = "Plato: a research framework for federated learning"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"

dependencies = [
    "aiohttp>=3.14.3",
    "accelerate>=1.15.0",
    "boto3>=1.43.106",
    "datasets>=5.0.1",
    "evaluate>=0.4.6",
    "gdown>=6.4.1",
    "munch>=4.0.0",
    "numpy>=2.5.3",
    "peft>=0.21.2",
    "python-socketio>=5.17.0",
    "requests>=2.34.2",
    "safetensors>=0.8.0",
    "scipy>=1.18.1",
    "tenseal>=0.3.18",
    "timm>=1.0.30",
    "torch>=2.14.1",
    "torch-optimizer>=0.3.0",
    "torchvision>=0.29.1",
    "transformers>=5.18.0",
    "zstd>=1.5.7.2",
]

[project.optional-dependencies]
mpc = [
    "kazoo>=2.11.0"
]
rl = [
    "gymnasium>=1.3.0"
]
dp = [
    "opacus>=1.6.0"
]
mlx = [
    "mlx>=0.32.3",
]
ssl = [
    "lightly>=1.5.26",
    "hydra-core>=1.3.7",
    "omegaconf>=2.3.1",
]
llm_eval = [
    "lighteval==0.13.0",
    "langdetect>=1.0.9,<2",
]

[project.urls]
Homepage = "https://github.com/TL-System/plato"
Repository = "https://github.com/TL-System/plato"
Documentation = "https://platodocs.netlify.app/"

# Basic tool configuration
[tool.ruff]
exclude = [
    "archives/retired",
    ".venv",
]
include = [
    "pyproject.toml",
    "plato/**/*.py",
    "tests/**/*.py",
    "examples/**/*.py",
]
line-length = 88
lint.select = ["I"]

[tool.hatch.build]
exclude = [
    "archives/**",
    "evidence/2026-refresh/reproductions/**",
]

[tool.hatch.build.targets.wheel]
packages = ["plato"]

[tool.uv.workspace]
members = [
    "examples/unlearning/fedunlearning",
    "examples/unlearning/knot",
    "examples/client_selection/pisces",
    "examples/client_selection/polaris",
    "examples/split_learning/llm_split_learning",
    "examples/ssl/calibre",
    "examples/ssl/smog",
    "examples/model_search/anycostfl",
    "examples/model_search/fedrolex",
    "examples/model_search/heterofl",
    "examples/detector",
    "examples/gradient_leakage_attacks",
]

[tool.uv]
required-version = ">=0.12.22"
# Authorized exception to Lighteval 0.13.0's nltk==3.9.1 metadata pin.
# Metrics are tested with 3.10.3; one unfixed model-path advisory remains.
override-dependencies = ["nltk==3.10.3"]
# Stable Hydra and Lighteval require different ANTLR runtime versions.
conflicts = [
    [{ extra = "ssl" }, { extra = "llm_eval" }],
]

[tool.uv.sources]
plato-learn = { workspace = true }

[dependency-groups]
test-base = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
# Mandatory DP, MPC and RL imports for the full test suite.
test = [
    { include-group = "test-base" },
    "plato-learn[dp,mpc,rl]",
]
test-model-search = [
    { include-group = "test" },
    "ptflops>=0.7.5",
]
dev = [
    { include-group = "test" },
    "ruff>=0.16.10",
    "ty>=0.0.84",
]
build = [
    "hatchling>=1.32.4",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
]
audit = [
    "pip-audit>=2.10.1",
]

# ty (type checker) configuration
[tool.ty]

[tool.ty.src]
# Remove `build` from the excluded directories.
exclude = [
    "examples/outdated",
    "archives/retired",
]

[tool.ty.rules]
"unresolved-import" = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv",
    "{arch}", "*.egg", "archives/retired",
]
addopts = "--strict-markers"
markers = [
    "mlx_native: explicit Apple Silicon native MLX qualification cases.",
    "retained_model_search: isolated retained model-search behavior requiring ptflops.",
    "runtime: fresh startup, CPU socket rounds and containment regressions.",
    "startup_runtime: real CPU socket round and socket failure cases.",
    "startup_containment: deliberate noncooperative teardown and child containment.",
    "integration: marks tests that require end-to-end config smoke runs.",
]
