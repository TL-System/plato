[clients]

# Type
type = "simple"

# The total number of clients
total_clients = 50

# The number of clients selected in each round
per_round = 50

# Should the clients compute test accuracy locally?
do_test = false

[server]
type = "diloco"
address = "127.0.0.1"
port = 8021

[server.diloco]
outer_optimizer = "nesterov"
outer_learning_rate = 0.7
outer_momentum = 0.9
aggregation_weighting = "uniform"
apply_outer_optimizer_to = "parameters"

[data]

# The training and testing dataset
datasource = "Torchvision"
dataset_name = "CIFAR10"
download = true

# Number of samples in each partition
partition_size = 1000

# IID or non-IID?
sampler = "iid"

[trainer]

# The type of the trainer
type = "basic"

# The maximum number of training rounds
rounds = 20

# The maximum number of clients running concurrently
max_concurrency = 7

# The target accuracy
target_accuracy = 0.8

# Number of local optimizer steps per DiLoCo synchronization.
local_steps_per_round = 500
preserve_optimizer_state = true

# DiLoCo paper inner-optimizer settings.
epochs = 250
batch_size = 512
optimizer = "AdamW"
lr_scheduler = "LambdaLR"

# The machine learning model
model_name = "resnet_18"

[algorithm]

# Weight extraction and model update path reused by DiLoCo.
type = "fedavg"

[parameters]

[parameters.optimizer]
lr = 0.0004
weight_decay = 0.1

[parameters.learning_rate]
warmup_steps = "1000it"
